name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned to ubuntu-24.04: the ubuntu-latest label migrates to Ubuntu 26 on
# 2026-10-19; move deliberately after validating the new image, not by surprise.

# Actions are pinned to full commit SHAs, not floating major tags: a tag can be
# moved to different code by whoever controls the action's repo, a SHA cannot.
# Dependabot (.github/dependabot.yml) tracks the github-actions ecosystem and
# opens PRs that bump the SHA and the trailing version comment together.

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Image pins track docker-compose.yml so CI validates the exact postgres /
    # valkey versions production runs; a major-version drift here would let
    # migrations pass in CI and fail on deploy.
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: wordseek
          POSTGRES_PASSWORD: wordseek
          POSTGRES_DB: wordseek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordseek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: ci-dummy-token
      DATABASE_URL: postgres://wordseek:wordseek@localhost:5432/wordseek_test
      REDIS_URI: redis://127.0.0.1:6379
      DATABASE_SSL: "false"
      INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun test

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker Image
        run: docker build -t wordseek-bot:ci .
